name: Build Echo Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create Release Keystore from Debug Key
        run: |
          mkdir -p app/keystore
          keytool -genkey -v -keystore app/keystore/release.keystore \
            -alias release -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Echo Music,O=Echo,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Optimized ARM64 Release APK
        run: ./gradlew :app:assembleArm64FossRelease --no-daemon -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-arm64-Release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          
